# =============================================================================
# cis_benchmark.conf
# Logstash Pipeline: Structured JSON File -> Elasticsearch (cis_benchmark)
# =============================================================================

input {
  file {
    # JSON file containing extracted CIS rules
    path => "/etc/logstash/conf.d/output.ndjson"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => "json"
  }
}

filter {
  # Remove default Logstash metadata fields to keep the document clean for RAG
  mutate {
    remove_field => [ "@timestamp", "@version", "host", "log", "event" ]
  }
}

output {
  elasticsearch {
    hosts => ["https://127.0.0.1:9200"]
    index => "cis_benchmark"
    data_stream => false
    ssl_enabled => true
    ca_trusted_fingerprint => "changeme"
    
    # For multi-OS safety, it is recommended to use a composite key:
    document_id => "%{rule_id}-%{[metadata][source]}"
    
    # Configure if Elasticsearch authentication is required
    user => "elastic"
    password => "changeme"
  }
}
